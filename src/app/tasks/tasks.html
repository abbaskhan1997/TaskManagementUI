<h2>My Tasks</h2>

<table border="1">
  <thead>
    <tr>
      <th>Title</th>
      <th>Description</th>
      <th>Status</th>
      <th>Priority</th>
      <th>Due Date</th>
    </tr>
  </thead>

  <tbody>
    @for (task of tasks; track task.id) {
      <tr>
        <td>{{ task.title }}</td>
        <td>{{ task.description }}</td>
        <td>{{ task.status }}</td>
        <td>{{ task.priority }}</td>
        <td>{{ task.dueDate }}</td>
      </tr>
    }
  </tbody>
</table>
