<h2>My Tasks</h2>

<div class="search-box">
  <input
    type="text"
    [(ngModel)]="searchText"
    placeholder="Search tasks..."
  >
</div>

<table border="1">
  <thead>
    <tr>
      <th>Title</th>
      <th>Description</th>
      <th>Status</th>
      <th>Priority</th>
      <th>Due Date</th>
      <th colspan="2">Action</th>
    </tr>
  </thead>

  <tbody>
    @for (task of filteredTasks; track task.id) {
      <tr>
        <td>{{ task.title }}</td>
        <td>{{ task.description }}</td>
        <td>{{ task.status }}</td>
        <td>{{ task.priority }}</td>
        <td>{{ task.dueDate }}</td>
        <td><button class="edit-btn"(click)="editTask(task)">Edit</button></td>
        <td><button class="delete-btn" (click)="deleteTask(task.id)">Delete</button></td>
      </tr>
    }
  </tbody>
</table>
