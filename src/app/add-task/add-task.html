<h2>Add Task</h2>

<form #taskForm="ngForm">

  <div>
    <label>Title</label>
    <input type="text"  [(ngModel)]="title"
      name="title" required>
  </div>

  <div>
    <label>Description</label>
    <textarea [(ngModel)]="description" name="description" required></textarea>
  </div>

  <div>
    <label>Status</label>
    <select [(ngModel)]="status" name="status" required>
       <option value="">Select Status</option>
      <option value="Pending">Pending</option>
      <option value="In Progress">In Progress</option>
      <option value="Completed">Completed</option>
    </select>
  </div>

  <div>
    <label>Priority</label>
    <select [(ngModel)]="priority" name="priority" required>
       <option value="">Select Priority</option>
      <option value="Low">Low</option>
      <option value="Medium">Medium</option>
      <option value="High">High</option>
    </select>
  </div>

  <div>
    <label>Due Date</label>
    <input type="date" [(ngModel)]="dueDate" name="dueDate" required>
  </div>

  @if (!isEditMode) {
  <button type="button" (click)="saveTask()"  [disabled]="!title || !description || !status || !priority || !dueDate">Save Task</button>
}

@if (isEditMode) {
  <button type="button" (click)="updateTask()" [disabled]="!title || !description || !status || !priority || !dueDate">Update Task</button>
}

</form>
