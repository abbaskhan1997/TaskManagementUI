<h2>User Management</h2>

<div class="search-box">
  <input type="text" [(ngModel)]="searchText" placeholder="Search users..." />
</div>

<table>
  <thead>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Email</th>
      <th>Role</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let user of filteredUsers">
      <td>{{ user.id }}</td>
      <td>{{ user.name }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.role }}</td>
      <td>
        <button class="edit-btn" (click)="editUser(user)">Edit</button>
        <button class="delete-btn" (click)="deleteUser(user.id)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>

@if (selectedUser) {
  <div class="modal-overlay">
    <div class="edit-modal">
      <h3>Edit User</h3>

      <input type="text" [(ngModel)]="selectedUser.name" placeholder="Name" />

      <input type="email" [(ngModel)]="selectedUser.email" placeholder="Email" />

      <select [(ngModel)]="selectedUser.role">
        <option value="User">User</option>
        <option value="Admin">Admin</option>
      </select>

      <div class="modal-actions">
        <button class="edit-btn" (click)="updateUser()">Update</button>
        <button class="delete-btn" (click)="selectedUser = null">Cancel</button>
      </div>
    </div>
  </div>
}
